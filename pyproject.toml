[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbm"
version = "0.4.2"
description = "Spin-based map-making (SBM) for CMB experiments"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yusuke Takase", email = "takase_y@s.okayama-u.ac.jp" }]
requires-python = ">=3.10"
keywords = ["CMB", "Map-making", "Cross-linking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.23",
    "healpy>=1.15",
    "h5py>=3.11",
    "ducc0>=0.40",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.1"]
test = ["pytest>=7"]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.16"]
notebooks = ["matplotlib>=3.1", "nbclient>=0.7", "nbformat>=5", "ipykernel>=6"]
# Keep in step with tool.ruff.required-version.
lint = ["ruff==0.17.4"]

[project.urls]
Repository = "https://github.com/yusuke-takase/SBM"

[tool.hatch.build.targets.wheel]
packages = ["sbm"]

[tool.ruff]
required-version = "==0.17.4"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "C4", "PIE", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The order of these imports is the order of ALL (the path of the signal).
"sbm/systematics/__init__.py" = ["I001"]
# the examples of the documentation import what each part of a page shows
"docs/examples/*.py" = ["E402"]
