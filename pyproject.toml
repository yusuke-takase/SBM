[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbm"
version = "0.4.1"
description = "Spin-based map-making (SBM) for CMB experiments"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yusuke Takase", email = "takase_y@s.okayama-u.ac.jp" }]
requires-python = ">=3.10"
keywords = ["CMB", "Map-making", "Cross-linking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.23",
    "healpy>=1.15",
    "h5py>=3.11",
    "ducc0>=0.34",
]

[project.optional-dependencies]
minuit = ["iminuit>=2.30"]
"low-ell" = ["sympy>=1.13"]
plot = ["matplotlib>=3.1"]
test = ["pytest>=7", "scipy>=1.10"]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.16"]

[project.urls]
Repository = "https://github.com/yusuke-takase/SBM"

[tool.hatch.build.targets.wheel]
packages = ["sbm"]

[tool.ruff.lint]
extend-select = []
