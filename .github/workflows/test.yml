name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Linux only; the documentation is built but not deployed.
    name: pytest (Python ${{ matrix.python }}, ${{ matrix.numpy }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            numpy: "numpy<2"
          - python: "3.12"
            numpy: "numpy>=2"
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install SBM
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install --python .venv/bin/python -e ".[test,low-ell,plot]" "${{ matrix.numpy }}"

      - name: Run pytest
        run: .venv/bin/python -m pytest tests -q

  docs:
    name: Sphinx documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build the documentation
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -e ".[docs]"
          .venv/bin/python -m sphinx -b html -W docs/source docs/build/html
